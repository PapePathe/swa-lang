name: Multi-OS C++ CI (LLVM 21)
on: [pull_request]

jobs:
  cpp-linter-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libgtest-dev llvm-21-dev ninja-build

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 googletest ninja
          echo "LLVM_DIR=$(brew --prefix llvm@21)/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=21.0.0 -y
          choco install ninja
          vcpkg install gtest:x64-windows

      - name: Configure CMake
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export LLVM_PATH=$(brew --prefix llvm@21)
            cmake -S . -B build -G "Ninja" \
              -DCMAKE_C_COMPILER=$LLVM_PATH/bin/clang \
              -DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++ \
              -DLLVM_DIR=$LLVM_PATH/lib/cmake/llvm \
              -DCMAKE_BUILD_TYPE=Release
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cmake -S . -B build -G "Ninja" \
              -DCMAKE_C_COMPILER=clang-21 \
              -DCMAKE_CXX_COMPILER=clang++-21 \
              -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
              -DCMAKE_BUILD_TYPE=Release
          else
            # Windows default
            cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Run Clang-Tidy & Format
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'
          database: 'build'
          clang-tidy-version: '21'
          clang-format-version: '21'

      - name: Build Project
        run: cmake --build build --config Release

      - name: Package CLI AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          DESTDIR=appdir cmake --install build
          mkdir -p appdir/usr/share/applications
          mkdir -p appdir/usr/share/icons/hicolor/256x256/apps
          touch appdir/usr/share/icons/hicolor/256x256/apps/swa.png
          export LD_LIBRARY_PATH=/usr/lib/llvm-21/lib:$LD_LIBRARY_PATH
          touch empty-icon.svg
          ./linuxdeploy-x86_64.AppImage --appdir appdir \
            --executable appdir/usr/local/bin/swa \
            --desktop-file none \
            --icon-file empty-icon.svg \
            --output appimage

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build
          cpack -G DragNDrop

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SwaCompiler-Linux
          path: "*.AppImage"

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SwaCompiler-macOS
          path: build/*.dmg

      - name: Upload Windows Binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SwaCompiler-Windows
          path: build/*.exe
